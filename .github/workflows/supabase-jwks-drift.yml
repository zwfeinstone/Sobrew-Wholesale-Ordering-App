name: Supabase JWKS drift

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-public-signing-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare bundled keys with Supabase
        run: npm run auth:jwks:check
